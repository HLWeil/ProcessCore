name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run all tests (dotnet, JavaScript, Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Restore .NET tools (fable, fsdocs)
        run: dotnet tool restore

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Install npm dependencies
        run: npm install

      - name: Sync Python environment
        run: uv sync

      - name: Run all tests (dotnet + JS transpile/run + Python transpile/run)
        run: dotnet run --project build/build.fsproj -- runtestsall
