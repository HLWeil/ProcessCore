$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "Sample.yml"
title: Sample
description: >
  Input or output biological, chemical, or digital sample in the process graph.
  Samples can derive from other samples, forming provenance chains.
type: object

properties:
  id:
    type: string
    description: Unique sample identifier (typically the sample name)

  type:
    type: string
    const: "Sample"
    description: Fixed type discriminator

  additionalType:
    type: string
    description: Decoration discriminator (e.g. Sample, Source)

  name:
    type: string
    description: Human-readable name identifying the sample

  additionalProperty:
    type: array
    description: Characteristics, factors, or other extensible metadata (SHOULD)
    items:
      oneOf:
        - type: string
          description: "@id reference to a Annotation"
        - $ref: "Annotation.yml"

required:
  - id
  - type
  - name

additionalProperties: false
