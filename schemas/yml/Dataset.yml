$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "Dataset.yml"
title: Dataset
description: >
  Container and context for data and processes. A Dataset groups a set of processes
  that belong together and provides administrative metadata.
type: object

properties:
  id:
    type: string
    description: Unique identifier for the dataset (MUST)

  type:
    type: string
    const: "Dataset"
    description: Fixed type discriminator

  additionalType:
    type: string
    description: >
      Decoration discriminator (e.g. Investigation, Study, Assay, ARC Workflow, ARC Run, Datamap)

  identifier:
    type: string
    description: Identifying descriptor for the dataset (MUST)

  title:
    type: string
    description: Human-readable title (SHOULD)

  description:
    type: string
    description: Short description or abstract (SHOULD)

  license:
    type: string
    description: License identifier, URL, or label (COULD)

  datePublished:
    type: string
    description: Publication date (COULD)

  dateCreated:
    type: string
    description: Creation date (COULD)

  dateModified:
    type: string
    description: Modification date (COULD)

  processes:
    type: array
    description: Processes contained in this dataset (SHOULD)
    items:
      oneOf:
        - type: string
          description: "@id reference to a Process"
        - $ref: "Process.yml"

  hasPart:
    type: array
    description: Sub-datasets or data files that are part of this dataset (SHOULD)
    items:
      oneOf:
        - type: string
          description: "@id reference to a Dataset or Data object"
        - $ref: "Dataset.yml"
        - $ref: "Data.yml"

  dataFiles:
    type: array
    description: Data files that belong to this dataset (COULD)
    items:
      oneOf:
        - type: string
          description: "@id reference to a Data object"
        - $ref: "Data.yml"

  agents:
    type: array
    description: People responsible for creating the dataset (COULD)
    items:
      oneOf:
        - type: string
          description: "@id reference to a Agent"
        - $ref: "Agent.yml"

  citations:
    type: array
    description: Scholarly articles cited by or associated with the dataset (COULD)
    items:
      oneOf:
        - type: string
          description: "@id reference to a ScholarlyArticle"
        - $ref: "ScholarlyArticle.yml"

  dataContexts:
    type: array
    description: Dataset-level datamap context entries (COULD)
    items:
      oneOf:
        - type: string
          description: "@id reference to a DataContext"
        - $ref: "DataContext.yml"

  additionalProperty:
    type: array
    description: Extensible metadata (COULD)
    items:
      oneOf:
        - type: string
          description: "@id reference to a Annotation"
        - $ref: "Annotation.yml"

required:
  - id
  - type
  - identifier

additionalProperties: false

