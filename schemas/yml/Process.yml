$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "Process.yml"
title: Process
description: >
  Core transformation node in the process graph. A Process connects inputs to
  outputs and references the Protocol that was executed.
type: object

# Cross-reference helpers (reused in inputs/outputs items)
$defs:
  sampleOrData:
    oneOf:
      - type: string
        description: "@id reference to a Sample or Data object"
      - $ref: "Sample.yml"
      - $ref: "Data.yml"

properties:
  id:
    type: string
    description: Unique process identifier (COULD)

  type:
    type: string
    const: "Process"
    description: Fixed type discriminator

  additionalType:
    type: string
    description: Decoration discriminator (e.g. Process, CreateAction)

  name:
    type: string
    description: Name of the process (MUST)

  inputs:
    type: array
    description: >
      Input samples or data files consumed by this process (SHOULD).
      The Nth input corresponds to the Nth output.
    items:
      $ref: "#/$defs/sampleOrData"

  outputs:
    type: array
    description: >
      Output samples or data files produced by this process (SHOULD).
      The Nth output corresponds to the Nth input.
    items:
      $ref: "#/$defs/sampleOrData"

  executesProtocol:
    oneOf:
      - type: string
        description: "@id reference to a Recipe"
      - $ref: "Recipe.yml"
    description: Protocol that was executed by this process (SHOULD)

  parameterValue:
    type: array
    description: Parameter key-value pairs capturing actual execution parameters (SHOULD)
    items:
      oneOf:
        - type: string
          description: "@id reference to a Annotation"
        - $ref: "Annotation.yml"

required:
  - type
  - name

additionalProperties: false
