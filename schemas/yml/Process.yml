$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "Process.yml"
title: Process
description: >
  Core transformation node in the process graph. A Process connects inputs to
  outputs and references the Protocol that was executed. The YAML arrays are a
  compact serialization of singular process edges.
type: object

# Cross-reference helpers (reused in inputs/outputs items)
$defs:
  sampleOrData:
    oneOf:
      - type: string
        description: "@id reference to a Sample or Data object"
      - $ref: "Sample.yml"
      - $ref: "Data.yml"

properties:
  id:
    type: string
    description: Unique process identifier (COULD)

  type:
    type: string
    const: "Process"
    description: Fixed type discriminator

  additionalType:
    type: string
    description: Decoration discriminator (e.g. Process, CreateAction)

  name:
    type: string
    description: Name of the process (MUST)

  inputs:
    type: array
    description: >
      Input nodes consumed by serialized process edges (SHOULD). The Nth input
      is expanded with the Nth output into one Process.
    items:
      $ref: "#/$defs/sampleOrData"

  outputs:
    type: array
    description: >
      Output nodes produced by serialized process edges (SHOULD). Unequal arrays
      are expanded with an absent endpoint on the shorter side.
    items:
      $ref: "#/$defs/sampleOrData"

  executesRecipe:
    oneOf:
      - type: string
        description: "@id reference to a Recipe"
      - $ref: "Recipe.yml"
    description: Recipe that was executed by this process (SHOULD)

  parameterValue:
    type: array
    description: Parameter key-value pairs capturing actual execution parameters (SHOULD)
    items:
      oneOf:
        - type: string
          description: "@id reference to a Annotation"
        - $ref: "Annotation.yml"

required:
  - type
  - name

additionalProperties: false
